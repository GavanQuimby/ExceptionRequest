<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Exception Request</title>
<style>
  :root {
    --paper: #f4efe3;
    --ink: #1d1b18;
    --faint: #6f695e;
    --rule: #cfc6b2;
    --red: #b3261e;
    --green: #1f6b3a;
    --amber: #a0620a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #2b2a27;
    color: var(--ink);
    font-family: "Courier New", Courier, ui-monospace, monospace;
    font-size: 16px;
    line-height: 1.5;
    padding: 18px 12px 40px;
  }
  .sheet {
    max-width: 560px;
    margin: 0 auto;
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,.035) 31px 32px);
    padding: 26px 22px 30px;
    border-radius: 3px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
  }
  header { border-bottom: 3px double var(--ink); padding-bottom: 14px; margin-bottom: 18px; }
  .bureau {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase; text-align: center;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px; line-height: 1.2; text-align: center; margin: 8px 0 12px;
  }
  .applicant { text-align: center; margin: 0; font-size: 15px; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; }
  .meta dt { color: var(--faint); text-transform: uppercase; font-size: 12px; letter-spacing: .08em; padding-top: 2px; }
  .meta dd { margin: 0; border-bottom: 1px dotted var(--faint); }
  .progress { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
  .bar { height: 4px; background: var(--rule); margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
  h2 { font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.3; margin: 0 0 6px; }
  .note { color: var(--faint); font-size: 14px; margin: 0 0 16px; }
  .opts { display: grid; gap: 10px; }
  button {
    font: inherit; color: var(--ink); cursor: pointer;
    background: rgba(255,255,255,.55);
    border: 1.5px solid var(--ink); border-radius: 2px;
    padding: 13px 14px; text-align: left; width: 100%;
    transition: background .12s, transform .12s;
  }
  button:hover, button:focus-visible { background: #fff; outline: none; transform: translateX(3px); }
  button.primary { background: var(--ink); color: var(--paper); text-align: center; font-weight: bold; letter-spacing: .06em; text-transform: uppercase; }
  button.primary:hover, button.primary:focus-visible { background: #000; transform: none; }
  button.link { border: 0; background: none; padding: 8px 0; width: auto; color: var(--faint); text-decoration: underline; font-size: 14px; }
  button.link:hover { transform: none; background: none; color: var(--ink); }
  .box::before { content: "\2610\00a0\00a0"; }
  .stamp {
    display: inline-block; font-family: Georgia, serif; font-weight: bold;
    font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    border: 4px solid currentColor; border-radius: 6px; padding: 8px 16px;
    transform: rotate(-7deg); margin: 10px 0 22px; opacity: .9;
    animation: thunk .35s cubic-bezier(.2,1.6,.4,1) both;
  }
  .stamp small { display: block; font-size: 11px; letter-spacing: .2em; font-weight: normal; }
  .granted { color: var(--green); } .probation { color: var(--amber); } .denied { color: var(--red); }
  @keyframes thunk { from { transform: rotate(-7deg) scale(2.4); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .stamp { animation: none; } button, .bar i { transition: none; } }
  .ruling { border: 1.5px solid var(--ink); background: rgba(255,255,255,.5); padding: 14px; margin: 0 0 16px; white-space: pre-wrap; font-size: 14px; }
  textarea { width: 100%; font: inherit; font-size: 14px; padding: 10px; margin-top: 10px; border: 1.5px solid var(--ink); background: #fff; }
  .center { text-align: center; }
  footer { margin-top: 26px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 11px; color: var(--faint); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <div class="bureau">Bureau of Certified Men Haters</div>
    <h1>Exception Request</h1>
    <p class="applicant">Applicant: <b id="applicant"></b></p>
  </header>
  <section id="stage" aria-live="polite"></section>
  <footer>Nothing you tap here is saved or sent anywhere. He only sees your verdict if you send it to him.</footer>
</main>

<script>
/* ================= EDIT THIS PART =================
   Change your name or the questions here.
   "key" stores her answer so it can appear in the final verdict.
   The last question decides the verdict: each option has a "verdict"
   of "granted", "probation" or "denied". */
const CONFIG = {
  applicantName: "Gavan",
  applicantFullName: "Gavan Quimby",
  intro: "Your bio says \"Certified Men Hater.\" I (Gavan) am asking for an exception. Answer 4 quick questions and you'll get a verdict to send me.",
  questions: [
    {
      q: "His opener was \"Can I apply for an exception?\" How was it?",
      key: "opener",
      options: [ { t: "Good" }, { t: "Fine" }, { t: "Bad" } ]
    },
    {
      q: "When's the best time to be in contact?",
      key: "contact",
      options: [ { t: "Mornings" }, { t: "Afternoons" }, { t: "Evenings" }, { t: "Late at night" } ]
    },
    {
      q: "If he gets a chance, the first date is:",
      key: "date",
      options: [ { t: "Coffee" }, { t: "Drinks" }, { t: "Food" }, { t: "A walk" } ]
    },
    {
      q: "Your verdict:",
      options: [
        { t: "Approved. He gets a chance.", verdict: "granted" },
        { t: "Maybe. He's on thin ice.", verdict: "probation" },
        { t: "Denied.", verdict: "denied" }
      ]
    }
  ]
};
/* =============== END OF EDITABLE PART =============== */

const stage = document.getElementById("stage");
document.getElementById("applicant").textContent = CONFIG.applicantFullName || CONFIG.applicantName;

let step = 0, verdict = "denied", answers = {};

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k === "onclick") n.addEventListener("click", attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  kids.forEach(c => n.append(c));
  return n;
}

function showIntro() {
  step = 0; verdict = "denied"; answers = {};
  stage.replaceChildren(
    el("p", null, CONFIG.intro),
    el("button", { class: "primary", onclick: showQuestion }, "Start")
  );
}

function showQuestion() {
  const total = CONFIG.questions.length;
  const item = CONFIG.questions[step];
  const fill = el("i"); fill.style.width = (step / total * 100) + "%";
  const opts = el("div", { class: "opts" });
  item.options.forEach(o => {
    opts.append(el("button", { onclick: () => {
      if (item.key) answers[item.key] = o.t;
      if (o.verdict) verdict = o.verdict;
      step++;
      step < total ? showQuestion() : showVerdict();
    } }, o.t));
  });
  stage.replaceChildren(
    el("div", { class: "progress" }, "Question " + (step + 1) + " of " + total),
    el("div", { class: "bar" }, fill),
    el("h2", null, item.q),
    opts
  );
  window.scrollTo({ top: 0 });
}

function showVerdict() {
  const name = CONFIG.applicantName;
  const details =
    "\nHis opener was: " + answers.opener +
    "\nFirst date: " + answers.date +
    "\nBest time to reach me: " + answers.contact;
  let cls, title, blurb, text;

  if (verdict === "granted") {
    cls = "granted"; title = "Approved";
    blurb = name + " gets a chance. Everyone else is still on the list.";
    text = "EXCEPTION REQUEST: APPROVED" + details;
  } else if (verdict === "probation") {
    cls = "probation"; title = "On Probation";
    blurb = name + " gets a trial run. One wrong move and it's over.";
    text = "EXCEPTION REQUEST: ON PROBATION (thin ice)" + details;
  } else {
    cls = "denied"; title = "Denied";
    blurb = "Request denied. " + name + " respects the decision.";
    text = "EXCEPTION REQUEST: DENIED";
  }

  const fallback = el("textarea", { rows: "5", readonly: "", hidden: "" });
  fallback.value = text;
  const copyBtn = el("button", { class: "primary", onclick: async () => {
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "Copied! Now paste it in your chat.";
    } catch (e) {
      fallback.hidden = false; fallback.focus(); fallback.select();
      copyBtn.textContent = "Copy the text below";
    }
  } }, "Copy my verdict");

  stage.replaceChildren(
    el("div", { class: "center" }, el("div", { class: "stamp " + cls }, title)),
    el("p", null, blurb),
    el("div", { class: "ruling" }, text),
    el("p", { class: "note" }, "Last step: copy your verdict and send it to " + name + " on Tinder."),
    copyBtn, fallback,
    el("div", { class: "center" }, el("button", { class: "link", onclick: showIntro }, "Start over"))
  );
  window.scrollTo({ top: 0 });
}

showIntro();
</script>
</body>
</html>
