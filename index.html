<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Form MH-1: Request for Individual Exception</title>
<style>
  :root {
    --paper: #f4efe3;
    --ink: #1d1b18;
    --faint: #6f695e;
    --rule: #cfc6b2;
    --red: #b3261e;
    --green: #1f6b3a;
    --amber: #a0620a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #2b2a27;
    color: var(--ink);
    font-family: "Courier New", Courier, ui-monospace, monospace;
    font-size: 16px;
    line-height: 1.5;
    padding: 18px 12px 40px;
  }
  .sheet {
    max-width: 560px;
    margin: 0 auto;
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,.035) 31px 32px);
    padding: 26px 22px 30px;
    border-radius: 3px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
  }
  header { border-bottom: 3px double var(--ink); padding-bottom: 14px; margin-bottom: 18px; }
  .bureau {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase; text-align: center;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px; line-height: 1.2; text-align: center; margin: 8px 0 12px;
  }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; }
  .meta dt { color: var(--faint); text-transform: uppercase; font-size: 12px; letter-spacing: .08em; padding-top: 2px; }
  .meta dd { margin: 0; border-bottom: 1px dotted var(--faint); }
  .progress { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
  .bar { height: 4px; background: var(--rule); margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
  h2 { font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.3; margin: 0 0 6px; }
  .note { color: var(--faint); font-size: 14px; margin: 0 0 16px; }
  .opts { display: grid; gap: 10px; }
  button {
    font: inherit; color: var(--ink); cursor: pointer;
    background: rgba(255,255,255,.55);
    border: 1.5px solid var(--ink); border-radius: 2px;
    padding: 13px 14px; text-align: left; width: 100%;
    transition: background .12s, transform .12s;
  }
  button:hover, button:focus-visible { background: #fff; outline: none; transform: translateX(3px); }
  button.primary { background: var(--ink); color: var(--paper); text-align: center; font-weight: bold; letter-spacing: .06em; text-transform: uppercase; }
  button.primary:hover, button.primary:focus-visible { background: #000; transform: none; }
  button.link { border: 0; background: none; padding: 8px 0; width: auto; color: var(--faint); text-decoration: underline; font-size: 14px; }
  button.link:hover { transform: none; background: none; color: var(--ink); }
  .box::before { content: "\2610\00a0\00a0"; }
  .stamp {
    display: inline-block; font-family: Georgia, serif; font-weight: bold;
    font-size: 26px; letter-spacing: .08em; text-transform: uppercase;
    border: 4px solid currentColor; border-radius: 6px; padding: 8px 16px;
    transform: rotate(-7deg); margin: 10px 0 22px; opacity: .9;
    animation: thunk .35s cubic-bezier(.2,1.6,.4,1) both;
  }
  .stamp small { display: block; font-size: 11px; letter-spacing: .2em; font-weight: normal; }
  .granted { color: var(--green); } .probation { color: var(--amber); } .denied { color: var(--red); }
  @keyframes thunk { from { transform: rotate(-7deg) scale(2.4); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .stamp { animation: none; } button, .bar i { transition: none; } }
  .ruling { border: 1.5px solid var(--ink); background: rgba(255,255,255,.5); padding: 14px; margin: 0 0 16px; white-space: pre-wrap; font-size: 14px; }
  textarea { width: 100%; font: inherit; font-size: 14px; padding: 10px; margin-top: 10px; border: 1.5px solid var(--ink); background: #fff; }
  .center { text-align: center; }
  footer { margin-top: 26px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 11px; color: var(--faint); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <div class="bureau">Bureau of Certified Men Haters</div>
    <h1>Form MH-1<br>Request for Individual Exception</h1>
    <dl class="meta">
      <dt>Applicant</dt><dd id="applicant"></dd>
      <dt>Reviewer</dt><dd>You (certified)</dd>
      <dt>Status</dt><dd id="status">Pending your review</dd>
    </dl>
  </header>
  <section id="stage" aria-live="polite"></section>
  <footer>Form MH-1 (rev. 1) &middot; Nothing you tap here is saved or sent anywhere. The ruling only exists if you send it.</footer>
</main>

<script>
/* ================= EDIT THIS PART =================
   Change your name, the wording, or the questions here.
   "score" is how much an answer counts toward approval.
   "key" stores her answer so it can appear in the final ruling. */
const CONFIG = {
  applicantName: "Gavan",
  applicantFullName: "Gavan Quimby",
  intro: "An applicant has requested an exception to your certification. The Bureau requires a reviewing officer to complete this form before any ruling is issued. It takes about a minute.",
  questions: [
    {
      q: "Section 1. Basis for your certification as a Men Hater?",
      note: "For the Bureau's records.",
      key: "basis",
      options: [
        { t: "Earned through extensive field experience" },
        { t: "Natural talent" },
        { t: "It's mostly a bit. Mostly." },
        { t: "That information is classified" }
      ]
    },
    {
      q: "Section 2. The applicant opened with \"Can I apply for an exception?\" Please rate the filing.",
      options: [
        { t: "Bold. Paperwork was in order.", score: 2 },
        { t: "Acceptable. I've processed worse.", score: 1 },
        { t: "The Bureau is not impressed.", score: 0 }
      ]
    },
    {
      q: "Section 3. Which offense should the applicant be permanently barred from committing?",
      note: "He will be required to sign off on your selection.",
      key: "ban",
      options: [
        { t: "Saying \"I'm not like other guys\"" },
        { t: "Never asking a single question back" },
        { t: "Texting \"wyd\" after midnight" },
        { t: "Explaining my own job to me" }
      ]
    },
    {
      q: "Section 4. If an exception were granted, the probationary hearing would take place over:",
      key: "hearing",
      options: [
        { t: "Coffee" },
        { t: "Drinks" },
        { t: "Food. Real food." },
        { t: "A walk, so I can leave at any time" }
      ]
    },
    {
      q: "Section 5. Who selects the venue?",
      key: "venue",
      options: [
        { t: "Me, obviously" },
        { t: "Him, and it had better be good" },
        { t: "A joint committee" }
      ]
    },
    {
      q: "Section 6. Be honest: how much of this form made you smile?",
      note: "Answers are under oath.",
      options: [
        { t: "More than I will ever admit", score: 2 },
        { t: "A little", score: 1 },
        { t: "I remain unmoved", score: 0 }
      ]
    },
    {
      q: "Section 7. Reviewing officer's recommendation:",
      note: "This one carries the most weight. All three are real options.",
      options: [
        { t: "Grant the exception", score: 4 },
        { t: "Probation. He's on thin ice.", score: 2 },
        { t: "Denied. Certification stands.", score: -10 }
      ]
    }
  ]
};
/* =============== END OF EDITABLE PART =============== */

const stage = document.getElementById("stage");
const statusEl = document.getElementById("status");
document.getElementById("applicant").textContent = CONFIG.applicantFullName || CONFIG.applicantName;

let step = 0, score = 0, answers = {};

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k === "onclick") n.addEventListener("click", attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  kids.forEach(c => n.append(c));
  return n;
}

function showIntro() {
  step = 0; score = 0; answers = {};
  statusEl.textContent = "Pending your review";
  stage.replaceChildren(
    el("p", null, CONFIG.intro),
    el("button", { class: "primary", onclick: showQuestion }, "Begin review")
  );
}

function showQuestion() {
  const total = CONFIG.questions.length;
  const item = CONFIG.questions[step];
  const fill = el("i"); fill.style.width = (step / total * 100) + "%";
  const opts = el("div", { class: "opts" });
  item.options.forEach(o => {
    opts.append(el("button", { class: "box", onclick: () => {
      score += o.score || 0;
      if (item.key) answers[item.key] = o.t;
      step++;
      step < total ? showQuestion() : showVerdict();
    } }, o.t));
  });
  stage.replaceChildren(
    el("div", { class: "progress" }, "Section " + (step + 1) + " of " + total),
    el("div", { class: "bar" }, fill),
    el("h2", null, item.q),
    el("p", { class: "note" }, item.note || ""),
    opts
  );
  window.scrollTo({ top: 0 });
}

function showVerdict() {
  const name = CONFIG.applicantName;
  let cls, title, sub, blurb, text;
  const terms =
    "Hearing: " + answers.hearing + "\n" +
    "Venue chosen by: " + answers.venue + "\n" +
    "Applicant is barred from: " + answers.ban;

  if (score >= 6) {
    cls = "granted"; title = "Exception Granted"; sub = "one (1) individual only";
    blurb = "The Bureau finds in favor of the applicant. Your certification remains valid against all other men.";
    text = "BUREAU RULING, FORM MH-1\nVerdict: EXCEPTION GRANTED\n" + terms;
  } else if (score >= 2) {
    cls = "probation"; title = "Probationary Exception"; sub = "revocable at any time";
    blurb = "The applicant is granted a trial period. One wrong move and the full certification applies.";
    text = "BUREAU RULING, FORM MH-1\nVerdict: PROBATION (thin ice)\n" + terms;
  } else {
    cls = "denied"; title = "Exception Denied"; sub = "certification upheld";
    blurb = "The Bureau has ruled against the applicant. " + name + " thanks the reviewing officer for her time and respects the decision.";
    text = "BUREAU RULING, FORM MH-1\nVerdict: DENIED. Certification stands.";
  }
  statusEl.textContent = title;

  const fallback = el("textarea", { rows: "6", readonly: "", hidden: "" });
  fallback.value = text;
  const copyBtn = el("button", { class: "primary", onclick: async () => {
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "Copied. Paste it in the chat.";
    } catch (e) {
      fallback.hidden = false; fallback.focus(); fallback.select();
      copyBtn.textContent = "Select the text below and copy it";
    }
  } }, "Copy the official ruling");

  stage.replaceChildren(
    el("div", { class: "center" },
      el("div", { class: "stamp " + cls }, title, el("small", null, sub))),
    el("p", null, blurb),
    el("div", { class: "ruling" }, text),
    el("p", { class: "note" }, "Rulings only take effect once delivered to the applicant. Copy it and send it to " + name + "."),
    copyBtn, fallback,
    el("div", { class: "center" }, el("button", { class: "link", onclick: showIntro }, "Start the review over"))
  );
  window.scrollTo({ top: 0 });
}

showIntro();
</script>
</body>
</html>
